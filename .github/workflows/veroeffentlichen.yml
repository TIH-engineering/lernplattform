# Veröffentlicht die Lernseite automatisch auf GitHub Pages,
# sobald Änderungen auf den Zweig „main“ hochgeladen werden.
name: Webseite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch: # erlaubt auch einen Start per Knopfdruck auf GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Dateien holen
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pakete installieren
        run: npm ci
      - name: Webseite bauen
        run: npm run build
      - name: Ergebnis bereitstellen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
