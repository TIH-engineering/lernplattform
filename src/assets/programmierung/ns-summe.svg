<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="340" height="260" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="inherit" font-size="15" role="img" aria-label="Struktogramm: Summe der Zahlen 1 bis 100" class="schaltbild"><title>Struktogramm: Summe der Zahlen 1 bis 100</title><rect x="10" y="10" width="320" height="40" /><text x="170" y="35" text-anchor="middle" fill="currentColor" stroke="none" font-family="ui-monospace, Consolas, monospace" font-size="14" >summe = 0</text><rect x="10" y="50" width="320" height="40" /><text x="170" y="75" text-anchor="middle" fill="currentColor" stroke="none" font-family="ui-monospace, Consolas, monospace" font-size="14" >i = 1</text><rect x="10" y="90" width="320" height="120" /><text x="20" y="116" text-anchor="start" fill="currentColor" stroke="none" font-family="ui-monospace, Consolas, monospace" font-size="14" >solange i &lt;= 100</text><rect x="38" y="130" width="292" height="40" /><text x="184" y="155" text-anchor="middle" fill="currentColor" stroke="none" font-family="ui-monospace, Consolas, monospace" font-size="14" >summe = summe + i</text><rect x="38" y="170" width="292" height="40" /><text x="184" y="195" text-anchor="middle" fill="currentColor" stroke="none" font-family="ui-monospace, Consolas, monospace" font-size="14" >i = i + 1</text><rect x="10" y="210" width="320" height="40" /><text x="170" y="235" text-anchor="middle" fill="currentColor" stroke="none" font-family="ui-monospace, Consolas, monospace" font-size="14" >Ausgabe: summe</text></svg>
