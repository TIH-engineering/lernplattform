" /><g transform="translate(40,0)"><rect x="0" y="-7" width="40" height="14"/></g></g><text x="250" y="215" text-anchor="middle" fill="currentColor" stroke="none" font-size="12"><tspan font-style="italic">R</tspan><tspan font-size="0.72em" dy="0.35em">B</tspan><tspan dy="-0.35em"></tspan> = 250 Ω</text><polyline points="190,190 60,190"/><line x1="300" y1="165" x2="200" y2="165" /><polygon points="200,165 209,169 209,161" fill="currentColor" stroke="none"/><text x="250" y="155" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">1 … 5 V → Steuerung</text><text x="380" y="120" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">Leitung</text><text x="380" y="136" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">(Hunderte m)</text></svg>
