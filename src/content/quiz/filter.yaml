titel: Filter
fragen:
  - typ: zahl
    stufe: grundlagen
    frage: 'Wie groß ist die Grenzfrequenz eines RC-Tiefpasses mit $R = 10\,\mathrm{k\Omega}$ und $C = 100\,\mathrm{nF}$?'
    loesung: 159.2
    einheit: Hz
    erklaerung: '$f_\mathrm{g} = 1/(2\pi R C) = 1/(2\pi \cdot 10^{4} \cdot 10^{-7})\,\mathrm{Hz} \approx 159\,\mathrm{Hz}$'

  - typ: mc
    stufe: grundlagen
    frage: Was gilt bei der Grenzfrequenz eines Filters 1. Ordnung?
    optionen:
      - text: Der Betrag ist auf 70,7 % (−3 dB) gefallen.
        richtig: true
      - text: Der Betrag ist auf 50 % (−6 dB) gefallen.
      - text: Der Betrag ist null.
      - text: Der Betrag ist auf 10 % (−20 dB) gefallen.
    erklaerung: 'Bei $f_\mathrm{g}$ ist $X_\mathrm{C} = R$ → $|H| = 1/\sqrt{2}$, die Phase beträgt ±45°.'

  - typ: mc
    stufe: grundlagen
    frage: Wie steil fällt der Betragsgang eines Tiefpasses 2. Ordnung weit oberhalb der Grenzfrequenz?
    optionen:
      - text: −40 dB pro Dekade
        richtig: true
      - text: −20 dB pro Dekade
      - text: −3 dB pro Dekade
      - text: −6 dB pro Dekade
    erklaerung: Jede Ordnung bringt −20 dB/Dekade (−6 dB/Oktave).

  - typ: zahl
    stufe: grundlagen
    frage: 'Die Spannung sinkt von $10\,\mathrm{V}$ auf $2\,\mathrm{V}$. Wie groß ist die Dämpfung in dB (mit Vorzeichen)?'
    loesung: -13.98
    einheit: dB
    toleranz: 0.1
    toleranzArt: absolut
    erklaerung: '$20 \log_{10}(2/10) = 20 \cdot (-0{,}699) \approx -14\,\mathrm{dB}$ Typischer Fehler: $10 \log$ statt $20 \log$ (−7 dB). Bei Spannungen gehört der Faktor 20 davor.'

  - typ: mc
    stufe: standard
    frage: Warum wird bei Spannungen mit 20·log und bei Leistungen mit 10·log gerechnet?
    optionen:
      - text: Weil die Leistung proportional zum Quadrat der Spannung ist
        richtig: true
      - text: Weil Spannungen immer doppelt so groß wie Leistungen sind
      - text: Weil das nur eine Vereinbarung ohne Grund ist
      - text: Weil Leistungen nur positiv sein können
    erklaerung: '$P \sim U^2$ → $10 \log(U_2^2/U_1^2) = 20 \log(U_2/U_1)$. So ergibt dieselbe Änderung denselben dB-Wert.'

  - typ: mc
    stufe: standard
    frage: Welche Güte hat ein Filter 2. Ordnung mit Butterworth-Verhalten?
    optionen:
      - text: 'Q ≈ 0,707'
        richtig: true
      - text: 'Q = 0,5'
      - text: 'Q = 1'
      - text: 'Q = 10'
    erklaerung: Butterworth bedeutet maximal flachen Durchlassbereich ohne Überhöhung, dabei gilt fg = f0. Q = 0,5 ist kritisch gedämpft.

  - typ: mc
    stufe: standard
    frage: Was muss man bei passiven Filtern 2. Ordnung beachten, damit es keine Überhöhung im Frequenzgang gibt?
    optionen:
      - text: Die Dämpfung (der Widerstand) muss groß genug sein, sodass Q ≤ 0,707 ist.
        richtig: true
      - text: Der Widerstand muss möglichst klein sein.
      - text: Die Spule muss möglichst groß sein.
      - text: Man darf nur Elektrolytkondensatoren verwenden.
    erklaerung: 'Q = (1/R)·√(L/C). Ein zu kleiner Widerstand ergibt eine hohe Güte und damit eine Resonanzspitze. Auch die Belastung durch die nächste Stufe muss berücksichtigt werden.'

  - typ: mc
    stufe: standard
    frage: Zwei gleiche RC-Tiefpässe werden ohne Pufferstufe hintereinandergeschaltet. Was passiert?
    optionen:
      - text: Die zweite Stufe belastet die erste – die Grenzfrequenz verschiebt sich nach unten.
        richtig: true
      - text: Es entsteht ein Hochpass.
      - text: Die Grenzfrequenz bleibt exakt gleich, nur die Steilheit verdoppelt sich.
      - text: Es entsteht eine Resonanzüberhöhung.
    erklaerung: Ohne Entkopplung darf man die Einzelfunktionen nicht einfach multiplizieren. Ein Spannungsfolger dazwischen löst das Problem.

  - typ: zahl
    stufe: standard
    frage: 'Ein Sallen-Key-Tiefpass mit gleichen Bauteilen soll $f_\mathrm{g} = 1\,\mathrm{kHz}$ haben, $C = 100\,\mathrm{nF}$. Wie groß ist $R$?'
    loesung: 1592
    einheit: Ω
    erklaerung: '$R = 1/(2\pi f_\mathrm{g} C) = 1/(2\pi \cdot 1000 \cdot 10^{-7})\,\Omega \approx 1592\,\Omega$ → Normwert 1,6 kΩ'

  - typ: zahl
    stufe: standard
    frage: 'Welche Verstärkung $K$ braucht ein Sallen-Key-Filter mit gleichen Bauteilen für Butterworth-Verhalten (3 Nachkommastellen)?'
    loesung: 1.586
    einheit: ''
    toleranz: 0.005
    toleranzArt: absolut
    erklaerung: '$Q = 1/(3 - K) = 1/\sqrt{2}$ → $K = 3 - \sqrt{2} \approx 1{,}586$ → $R_\mathrm{f} \approx 0{,}586\,R_\mathrm{g}$'

  - typ: mc
    stufe: grundlagen
    frage: Welche Vorteile haben aktive Filter gegenüber passiven?
    optionen:
      - text: Keine Spulen nötig
        richtig: true
      - text: Stufen sind durch den niederohmigen OPV-Ausgang entkoppelt
        richtig: true
      - text: Verstärkung im Durchlassbereich möglich
        richtig: true
      - text: Sie brauchen keine Versorgungsspannung
    erklaerung: Aktive Filter brauchen eine Versorgung, und ihr Aussteuerbereich und ihre Bandbreite sind begrenzt.

  - typ: zahl
    stufe: vertiefung
    frage: 'Ein RLC-Tiefpass hat $L = 10\,\mathrm{mH}$ und $C = 1\,\mu\mathrm{F}$. Welcher Widerstand ergibt Butterworth-Verhalten?'
    loesung: 141.4
    einheit: Ω
    erklaerung: '$R = \dfrac{1}{Q}\sqrt{\dfrac{L}{C}} = \dfrac{100\,\Omega}{0{,}707} \approx 141\,\Omega$'

  - typ: mc
    stufe: vertiefung
    frage: 'Ein Bandpass besteht aus Hochpass (fg = 50 Hz), Tiefpass (fg = 5 kHz) und einem Verstärker mit 20 dB. Wie groß ist der Pegel im Durchlassbereich?'
    optionen:
      - text: Etwa +20 dB
        richtig: true
      - text: Etwa 0 dB
      - text: Etwa −3 dB
      - text: Etwa +40 dB
    erklaerung: Im Durchlassbereich dämpfen die Filter praktisch nicht, es wirkt nur die Verstärkung (+20 dB = Faktor 10).

  # ---------- Praxis: Messen von Frequenzgängen ----------
  - typ: mc
    stufe: standard
    frage: Ein RC-Tiefpass mit berechnet 1,59 kHz Grenzfrequenz wird mit 1,45 kHz gemessen. Was ist die wahrscheinlichste Ursache?
    optionen:
      - text: die Toleranz des Kondensators (etwa +10 %)
        richtig: true
      - text: die Eingangskapazität des Oszilloskops von rund 24 pF
      - text: der Innenwiderstand des Generators verändert die Grenzfrequenz stark
      - text: das Filter ist defekt
    erklaerung: '$f_\mathrm{g} \sim 1/C$ – 1,45 kHz entspricht $C \approx 11\,\mathrm{nF}$ statt 10 nF. 24 pF parallel zu 10 nF verschieben $f_\mathrm{g}$ nur um 0,2 %.'

  - typ: mc
    stufe: vertiefung
    frage: Ein gemessener Tiefpass 2. Ordnung hat bei der Kennfrequenz (Phase −90°) denselben Pegel wie im Durchlassbereich. Welche Güte hat er?
    optionen:
      - text: Q ≈ 1
        richtig: true
      - text: Q ≈ 0,5
      - text: Q ≈ 0,707
      - text: Q ≈ 2
    erklaerung: 'Bei $f_0$ gilt $\lvert H \rvert = K \cdot Q$. Gleicher Pegel wie im Durchlass heißt $Q = 1$. Ein Butterworth-Filter ($Q = 0{,}707$) läge dort 3 dB unter dem Durchlasspegel.'

  # ---------- Signale und Spektren ----------
  - typ: mc
    stufe: grundlagen
    frage: Welches Spektrum hat ein reiner Sinus mit 50 Hz?
    optionen:
      - text: eine einzige Linie bei 50 Hz
        richtig: true
      - text: Linien bei 50, 150, 250 Hz …
      - text: ein breites, kontinuierliches Band
      - text: Linien bei 25 und 75 Hz
    erklaerung: Der Sinus ist der Grundbaustein der Fourier-Zerlegung – er braucht keine Oberschwingungen. Oberschwingungen zeigen, dass ein Signal vom Sinus abweicht.

  - typ: zahl
    stufe: grundlagen
    frage: 'Ein symmetrisches Rechteck hat den Scheitelwert $\hat{u} = 10\,\mathrm{V}$. Wie groß ist der Scheitelwert der 3. Harmonischen?'
    loesung: 4.244
    einheit: V
    toleranz: 2
    erklaerung: '$\hat{u}_3 = \dfrac{4 \hat{u}}{3\pi} = \dfrac{40\,\mathrm{V}}{3\pi} \approx 4{,}24\,\mathrm{V}$. Typischer Fehler: den Faktor $4/\pi$ vergessen (3,33 V).'

  - typ: mc
    stufe: standard
    frage: Warum enthält ein symmetrisches Rechteck (Tastverhältnis 50 %) keine geradzahligen Harmonischen?
    optionen:
      - text: Es ist halbwellensymmetrisch – die zweite Halbperiode ist das Spiegelbild der ersten, gerade Harmonische würden diese Symmetrie zerstören.
        richtig: true
      - text: Weil gerade Zahlen in der Fourier-Reihe grundsätzlich nicht vorkommen.
      - text: Weil das Oszilloskop gerade Harmonische herausfiltert.
      - text: Weil die Flanken unendlich steil sind.
    erklaerung: Für $u(t + T/2) = -u(t)$ bleiben nur ungerade Harmonische übrig. Ein Rechteck mit z. B. 30 % Tastverhältnis hat auch Linien bei $2 f_0$, $4 f_0$ …

  - typ: mc
    stufe: standard
    frage: Warum fallen die Oberschwingungen eines Dreiecks viel schneller ab als die eines Rechtecks?
    optionen:
      - text: Das Dreieck hat keine Sprünge, nur Knicke – seine Amplituden fallen mit 1/n², die des Rechtecks nur mit 1/n.
        richtig: true
      - text: Weil das Dreieck eine kleinere Amplitude hat.
      - text: Weil das Dreieck keine Grundschwingung hat.
      - text: Das stimmt nicht, beide fallen gleich schnell.
    erklaerung: Je glatter ein Signal, desto weniger hohe Frequenzen braucht es. Sprünge erfordern viele, kräftige Oberschwingungen.

  - typ: zahl
    stufe: standard
    frage: 'Ein Messsystem tastet mit $f_\mathrm{s} = 10\,\mathrm{kHz}$ ab und hat kein Anti-Aliasing-Filter. Bei welcher Frequenz erscheint ein Signal mit 8,5 kHz?'
    loesung: 1500
    einheit: Hz
    toleranz: 1
    erklaerung: '$f_\mathrm{alias} = \lvert 8{,}5\,\mathrm{kHz} - 10\,\mathrm{kHz} \rvert = 1{,}5\,\mathrm{kHz}$. Alles oberhalb von $f_\mathrm{s}/2 = 5\,\mathrm{kHz}$ wird an dieser Grenze gespiegelt.'

  - typ: zahl
    stufe: standard
    frage: 'Eine FFT verwendet 4096 Abtastwerte bei $f_\mathrm{s} = 20\,\mathrm{kS/s}$. Wie groß ist der Linienabstand $\Delta f$?'
    loesung: 4.883
    einheit: Hz
    toleranz: 2
    erklaerung: '$\Delta f = f_\mathrm{s}/N = 20\,000\,\mathrm{Hz}/4096 \approx 4{,}88\,\mathrm{Hz}$ – das ist der Kehrwert der Aufzeichnungsdauer (0,205 s).'

  - typ: mc
    stufe: vertiefung
    frage: In einer FFT ist eine einzelne Sinusfrequenz auf viele Nachbarlinien „verschmiert“. Was ist die wahrscheinlichste Ursache, und was hilft?
    optionen:
      - text: Spektrale Leckage, weil keine ganze Zahl von Perioden aufgezeichnet wurde – ein Hann- oder Flat-Top-Fenster verringert sie.
        richtig: true
      - text: Aliasing – eine höhere Abtastrate hilft.
      - text: Das Signal ist kein Sinus, sondern Rauschen.
      - text: Die Amplitude ist zu groß – den Eingang empfindlicher stellen.
    erklaerung: Die FFT setzt den Abschnitt periodisch fort. Bei nicht ganzzahliger Periodenzahl entsteht an der Nahtstelle ein Sprung. Fensterfunktionen gehen am Rand auf null und vermeiden diesen Sprung.

  - typ: mc
    stufe: vertiefung
    frage: Was ist der Unterschied zwischen DFT und FFT?
    optionen:
      - text: Die FFT ist ein besonders schneller Rechenweg für die DFT – das Ergebnis ist dasselbe.
        richtig: true
      - text: Die FFT ist genauer als die DFT.
      - text: Die DFT gilt nur für periodische, die FFT nur für nicht periodische Signale.
      - text: Die FFT braucht keine Abtastwerte.
    erklaerung: Beide berechnen aus N Abtastwerten dasselbe Spektrum. Die FFT braucht dafür statt etwa N² nur etwa N·log₂N Rechenschritte – bei 65 536 Werten ein Faktor von rund 4000.
