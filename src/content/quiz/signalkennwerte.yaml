titel: Signalkennwerte
fragen:
  - typ: zahl
    stufe: grundlagen
    frage: 'Eine Periode dauert 2,5 ms. Wie groß ist die Frequenz?'
    loesung: 400
    einheit: Hz
    erklaerung: '$f = 1/T = 1/(2{,}5 \cdot 10^{-3}\,\mathrm{s}) = 400\,\mathrm{Hz}$'

  - typ: zahl
    stufe: grundlagen
    frage: 'Eine Sinusspannung hat den Effektivwert 12 V. Wie groß ist der Spitze-Spitze-Wert?'
    loesung: 33.94
    einheit: V
    erklaerung: '$\hat{u} = \sqrt{2} \cdot 12\,\mathrm{V} \approx 16{,}97\,\mathrm{V}$ → $U_\mathrm{ss} = 2\hat{u} \approx 33{,}9\,\mathrm{V}$'

  - typ: mc
    stufe: grundlagen
    frage: Was ist der Effektivwert einer Wechselspannung?
    optionen:
      - text: Der Wert einer Gleichspannung, die in einem Widerstand dieselbe Wärmeleistung erzeugt
        richtig: true
      - text: Der größte Wert in einer Periode
      - text: Der Mittelwert über eine Periode
      - text: Der Mittelwert des Betrags
    erklaerung: 'RMS: quadrieren, mitteln, Wurzel ziehen. Der Mittelwert des Betrags ist der Gleichrichtwert.'

  - typ: mc
    stufe: grundlagen
    frage: Wie groß ist der arithmetische Mittelwert einer reinen Sinusspannung?
    optionen:
      - text: 'Null'
        richtig: true
      - text: 0,637 · û
      - text: 0,707 · û
      - text: û
    erklaerung: Die Flächen über und unter der Zeitachse sind gleich groß – Kennzeichen einer reinen Wechselgröße.

  - typ: mc
    stufe: standard
    frage: Welche Werte haben Scheitelfaktor und Formfaktor beim Sinus?
    optionen:
      - text: 'kₛ = 1,414 und k_f = 1,111'
        richtig: true
      - text: 'kₛ = 1 und k_f = 1'
      - text: 'kₛ = 1,732 und k_f = 1,155'
      - text: 'kₛ = 1,111 und k_f = 1,414'
    erklaerung: Rechteck hat 1 und 1, Dreieck 1,732 und 1,155.

  - typ: zahl
    stufe: standard
    frage: 'Ein Rechteck liegt 1 ms auf +8 V und 3 ms auf 0 V. Wie groß ist der Effektivwert?'
    loesung: 4
    einheit: V
    erklaerung: '$U = \sqrt{(64\,\mathrm{V^2} \cdot 1\,\mathrm{ms})/4\,\mathrm{ms}} = \sqrt{16}\,\mathrm{V} = 4\,\mathrm{V}$ – der Mittelwert ist nur 2 V.'

  - typ: zahl
    stufe: standard
    frage: 'Ein Rechteck liegt 2 ms auf +6 V und 2 ms auf −2 V. Wie groß ist der arithmetische Mittelwert?'
    loesung: 2
    einheit: V
    erklaerung: '$\bar{u} = (6 \cdot 2 - 2 \cdot 2)\,\mathrm{V \cdot ms}/4\,\mathrm{ms} = 2\,\mathrm{V}$; der Gleichrichtwert wäre 4 V.'

  - typ: zahl
    stufe: standard
    frage: 'Eine Mischspannung besteht aus 14 V Gleichanteil und einem Wechselanteil mit 9 V Effektivwert. Wie groß ist der Gesamteffektivwert?'
    loesung: 16.64
    einheit: V
    erklaerung: '$U = \sqrt{14^2 + 9^2}\,\mathrm{V} = \sqrt{277}\,\mathrm{V} \approx 16{,}64\,\mathrm{V}$ – quadratisch addieren, nicht 23 V!'

  - typ: zahl
    stufe: standard
    frage: 'Ein PWM-Signal 0/24 V hat einen Tastgrad von 36 %. Wie groß ist der Effektivwert?'
    loesung: 14.4
    einheit: V
    erklaerung: '$U = \sqrt{D} \cdot \hat{u} = 0{,}6 \cdot 24\,\mathrm{V} = 14{,}4\,\mathrm{V}$; der Mittelwert beträgt 8,64 V. Typischer Fehler: $D$ statt $\sqrt{D}$ verwenden – das ergibt den Mittelwert 8,64 V, nicht den Effektivwert.'

  - typ: mc
    stufe: standard
    frage: Was zeigt ein Multimeter in Stellung V DC bei einer Mischspannung an?
    optionen:
      - text: Den arithmetischen Mittelwert (Gleichanteil)
        richtig: true
      - text: Den Effektivwert
      - text: Den Scheitelwert
      - text: Den Spitze-Spitze-Wert
    erklaerung: Der Wechselanteil mittelt sich heraus.

  - typ: mc
    stufe: vertiefung
    frage: Ein einfaches (nicht True-RMS) Multimeter misst eine symmetrische Rechteckspannung. Was passiert?
    optionen:
      - text: Es zeigt etwa 11 % zu viel an.
        richtig: true
      - text: Es zeigt richtig an.
      - text: Es zeigt etwa 11 % zu wenig an.
      - text: Es zeigt null an.
    erklaerung: 'Es misst den Gleichrichtwert (= û) und multipliziert mit dem Sinus-Formfaktor 1,111 – der Effektivwert des Rechtecks ist aber auch û.'

  - typ: mc
    stufe: vertiefung
    frage: Wozu gibt man den Scheitelfaktor eines Signals bzw. den maximalen Scheitelfaktor eines Messgeräts an?
    optionen:
      - text: Um zu beurteilen, ob spitze Signale (Impulse) noch richtig gemessen werden
        richtig: true
      - text: Um den Gleichanteil zu bestimmen
      - text: Um die Frequenz zu berechnen
      - text: Er hat in der Messtechnik keine Bedeutung.
    erklaerung: Bei hohem Scheitelfaktor sind die Spitzen im Verhältnis zum Effektivwert groß – der Eingangsverstärker des Messgeräts kann übersteuern.

  # ---------- Signale und Spektren ----------
  - typ: mc
    stufe: grundlagen
    frage: Welches Spektrum hat ein reiner Sinus mit 50 Hz?
    optionen:
      - text: eine einzige Linie bei 50 Hz
        richtig: true
      - text: Linien bei 50, 150, 250 Hz …
      - text: ein breites, kontinuierliches Band
      - text: Linien bei 25 und 75 Hz
    erklaerung: Der Sinus ist der Grundbaustein der Fourier-Zerlegung – er braucht keine Oberschwingungen. Oberschwingungen zeigen, dass ein Signal vom Sinus abweicht.

  - typ: zahl
    stufe: grundlagen
    frage: 'Ein symmetrisches Rechteck hat den Scheitelwert $\hat{u} = 10\,\mathrm{V}$. Wie groß ist der Scheitelwert der 3. Harmonischen?'
    loesung: 4.244
    einheit: V
    toleranz: 2
    erklaerung: '$\hat{u}_3 = \dfrac{4 \hat{u}}{3\pi} = \dfrac{40\,\mathrm{V}}{3\pi} \approx 4{,}24\,\mathrm{V}$. Typischer Fehler: den Faktor $4/\pi$ vergessen (3,33 V).'

  - typ: mc
    stufe: standard
    frage: Warum enthält ein symmetrisches Rechteck (Tastverhältnis 50 %) keine geradzahligen Harmonischen?
    optionen:
      - text: Es ist halbwellensymmetrisch – die zweite Halbperiode ist das Spiegelbild der ersten, gerade Harmonische würden diese Symmetrie zerstören.
        richtig: true
      - text: Weil gerade Zahlen in der Fourier-Reihe grundsätzlich nicht vorkommen.
      - text: Weil das Oszilloskop gerade Harmonische herausfiltert.
      - text: Weil die Flanken unendlich steil sind.
    erklaerung: Für $u(t + T/2) = -u(t)$ bleiben nur ungerade Harmonische übrig. Ein Rechteck mit z. B. 30 % Tastverhältnis hat auch Linien bei $2 f_0$, $4 f_0$ …

  - typ: mc
    stufe: standard
    frage: Warum fallen die Oberschwingungen eines Dreiecks viel schneller ab als die eines Rechtecks?
    optionen:
      - text: Das Dreieck hat keine Sprünge, nur Knicke – seine Amplituden fallen mit 1/n², die des Rechtecks nur mit 1/n.
        richtig: true
      - text: Weil das Dreieck eine kleinere Amplitude hat.
      - text: Weil das Dreieck keine Grundschwingung hat.
      - text: Das stimmt nicht, beide fallen gleich schnell.
    erklaerung: Je glatter ein Signal, desto weniger hohe Frequenzen braucht es. Sprünge erfordern viele, kräftige Oberschwingungen.

  - typ: zahl
    stufe: standard
    frage: 'Ein Messsystem tastet mit $f_\mathrm{s} = 10\,\mathrm{kHz}$ ab und hat kein Anti-Aliasing-Filter. Bei welcher Frequenz erscheint ein Signal mit 8,5 kHz?'
    loesung: 1500
    einheit: Hz
    toleranz: 1
    erklaerung: '$f_\mathrm{alias} = \lvert 8{,}5\,\mathrm{kHz} - 10\,\mathrm{kHz} \rvert = 1{,}5\,\mathrm{kHz}$. Alles oberhalb von $f_\mathrm{s}/2 = 5\,\mathrm{kHz}$ wird an dieser Grenze gespiegelt.'

  - typ: zahl
    stufe: standard
    frage: 'Eine FFT verwendet 4096 Abtastwerte bei $f_\mathrm{s} = 20\,\mathrm{kS/s}$. Wie groß ist der Linienabstand $\Delta f$?'
    loesung: 4.883
    einheit: Hz
    toleranz: 2
    erklaerung: '$\Delta f = f_\mathrm{s}/N = 20\,000\,\mathrm{Hz}/4096 \approx 4{,}88\,\mathrm{Hz}$ – das ist der Kehrwert der Aufzeichnungsdauer (0,205 s).'

  - typ: mc
    stufe: vertiefung
    frage: In einer FFT ist eine einzelne Sinusfrequenz auf viele Nachbarlinien „verschmiert“. Was ist die wahrscheinlichste Ursache, und was hilft?
    optionen:
      - text: Spektrale Leckage, weil keine ganze Zahl von Perioden aufgezeichnet wurde – ein Hann- oder Flat-Top-Fenster verringert sie.
        richtig: true
      - text: Aliasing – eine höhere Abtastrate hilft.
      - text: Das Signal ist kein Sinus, sondern Rauschen.
      - text: Die Amplitude ist zu groß – den Eingang empfindlicher stellen.
    erklaerung: Die FFT setzt den Abschnitt periodisch fort. Bei nicht ganzzahliger Periodenzahl entsteht an der Nahtstelle ein Sprung. Fensterfunktionen gehen am Rand auf null und vermeiden diesen Sprung.

  - typ: mc
    stufe: vertiefung
    frage: Was ist der Unterschied zwischen DFT und FFT?
    optionen:
      - text: Die FFT ist ein besonders schneller Rechenweg für die DFT – das Ergebnis ist dasselbe.
        richtig: true
      - text: Die FFT ist genauer als die DFT.
      - text: Die DFT gilt nur für periodische, die FFT nur für nicht periodische Signale.
      - text: Die FFT braucht keine Abtastwerte.
    erklaerung: Beide berechnen aus N Abtastwerten dasselbe Spektrum. Die FFT braucht dafür statt etwa N² nur etwa N·log₂N Rechenschritte – bei 65 536 Werten ein Faktor von rund 4000.
